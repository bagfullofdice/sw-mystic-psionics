name: Build Foundry Compendiums

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-compendiums.mjs"
      - "module.json"
      - "styles/**"
      - "README.md"
      - ".github/workflows/build-compendiums.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Foundry CLI
        run: npm install -g @foundryvtt/foundryvtt-cli
      - name: Generate compendium source
        run: node scripts/build-compendiums.mjs
      - name: Compile compendiums
        run: |
          rm -rf packs/mystic-powers packs/mystic-class-features
          mkdir -p packs
          fvtt package pack -n "mystic-powers" --in "build/powers" --out "packs"
          fvtt package pack -n "mystic-class-features" --in "build/features" --out "packs"
      - name: Build install ZIP
        run: |
          rm -rf dist package
          mkdir -p dist package/sw-mystic-psionics
          cp module.json README.md package/sw-mystic-psionics/
          cp -R scripts styles packs package/sw-mystic-psionics/
          cd package
          zip -qr "../dist/sw-mystic-psionics-v0.2.0.zip" sw-mystic-psionics
      - name: Commit built packs and package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs dist
          if ! git diff --cached --quiet; then
            git commit -m "Build v0.2.0 compendiums and install package [skip ci]"
            git push
          fi
